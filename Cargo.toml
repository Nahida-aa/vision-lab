[workspace]
resolver = "3"
members = [
    "packages/rapidocr-ort", "tools/gen_ui_img", "tools/accel-set", "packages/subtitle-ocr",
    "packages/geometry", "packages/subtitle-finder", "packages/ocr-types", "packages/subtitle-ocr-post",
    # 纯字幕领域底座（SubtitleSegment，无 OCR 依赖）。
    "packages/subtitle",
    # 颜色连通域原语 + 布局层（examples/split-panels 演示纯图片 UI 的切分）。
    "packages/color-analysis", "packages/ocr-layout",
    # 界面自动化代理（识别→定位→点击，依赖 ocr-layout / capturer / screen-operator）。
    "packages/ocr-agent",
    # 通用图像转换 / 屏幕操作层（ocr-agent 的依赖；用 workspace 继承须在 members 内）。
    "packages/image_util", "packages/screen-operator",
    # 基准测试驱动（独立 cargo 包，见 tests/bench/subtitle-ocr）。
    # 不属于常规构建目标，故不放进 default-members。
    "tests/bench/subtitle-ocr",
]

# default-members：当你只敲 `cargo build` / `cargo run`（不带 -p）时，
# cargo 实际去构建哪些成员。这里只默认构建 apps/*（二进制例子），
# 不碰 crates/*（库）与 tests/bench 基准包。原因：
#   - 库本身没有 main，单独 `cargo run` 无意义；
#   - 新人clone后直接 `cargo run` 不会误触发所有内部库的编译，体验更轻；
#   - bench 是可选基准工具，不应拖累默认构建。
# 想全量构建时，用 `cargo build --workspace`。
default-members = [
    "tools/gen_ui_img", "tools/accel-set", "packages/subtitle-ocr",
]

# [workspace.package] 里写的字段会被子包用 `version.workspace = true` 继承。
# 这样全仓库版本号、edition、license 统一改一处即可。
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
# 仓库 description 的唯一源（GitHub 仓库简介 + crates.io 共用一句话）。
description = "OCR 工具链 + 屏幕自动化 agent：视频字幕识别 / GUI 测试 / 智能操作（看/操作分离，ydotool + KWin）"

# GitHub 仓库元数据的唯一源（description 见上方，topics 见下）。
# 用自定义 metadata 段，不污染 crates.io 的 keywords 语义（后者限 5 个）。
# 同步命令：node scripts/sync-github-meta.mjs（改这里一处即刷到 GitHub，需 gh 已登录）。
[workspace.metadata.github]
topics = [
    "ocr",
    "subtitle",
    "screen-automation",
    "computer-use",
    "rust",
]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# 结构化日志订阅端（RUST_LOG 过滤），各 CLI / dev-dependencies 共用。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
# 张量/HWC u8 图像缓冲：版本须统一（ort rc.13 内部锁定 ndarray 0.17）。
ndarray = "0.17"
rust-embed = { version = "8.11", features = ["include-exclude"] }
# 通用图像转换工具（rgba→rgb 等），与业务解耦。
image-util = { path = "packages/image_util" }
image = "0.25"
# clang-runtime: 强制绑定生成走子进程而非线程, 避免 clang-sys 因树内其它 crate
# 开启 runtime 导致多线程 load libclang 时 panic (opencv-rust TROUBLESHOOTING #8)。
opencv = { version = "0.100.0", default-features = false, features = ["imgproc", "videoio", "clang-runtime"] }
ort = "2.0.0-rc.13"
burn = "0.21.0"
util = { path = "packages/util" }
glam = "0.33.2"
# 纯 Rust 高性能线性代数（faer）。作为通用底座，替代/降低对 opencv 在矩阵运算
# （如透视变换 getPerspectiveTransform）上的依赖。SIMD/多线程优化。
faer = "0.24.4"
# 视频解码（subtitle-finder 逐帧 30fps 用）。
ffmpeg-next = "9.0.0"
# 高并发 malloc（subtitle-finder 多 worker transform 大量 1MB 级分配）。
mimalloc = { version = "0.1", default-features = false }
# PP-OCR det/rec/cls 引擎（onnxruntime 推理 + DB 后处理）。
# 跨包共享，统一走 workspace，改 path/版本只动这一处。
rapidocr-ort = { path = "packages/rapidocr-ort" }
ocr-types = { path = "packages/ocr-types" }
subtitle = { path = "packages/subtitle" }
subtitle-ocr-post = { path = "packages/subtitle-ocr-post" }
subtitle-finder = { path = "packages/subtitle-finder" }
subtitle-ocr = { path = "packages/subtitle-ocr" }
# 纯 Rust 二维多边形几何（凸包 / 旋转卡尺最小外接矩形 / 框角点 / 多边形偏移）。
# 供 rapidocr-ort 的 det 后处理复刻 cpp 的 minAreaRect + unclip 几何。
geometry = { path = "packages/geometry" }
# 屏幕抓取（ScreenCast 窗口流 / 全屏）。已随仓库结构迁移到 packages/ 下，
# 跨包共享，统一走 workspace。
capturer = { path = "packages/capturer" }
# gpui 相关依赖统一在 workspace 声明语义版本，真正的 git 源由下方
# [patch.crates-io] 覆盖（cargo 要求 patch 只能写在 workspace 根）。
gpui = { version = "0.2.2", default-features = false }
gpui_macros = { version = "0.1.0" }
gpui_platform = { version = "0.1.0" }
gpui_web = { version = "0.1.0" }
gpui_util = { version = "0.1.0" }
gpui_wgpu = { version = "0.1.0" }
# specta 类型导出（LocalDub 经 fnrpc 注册 OCR 结果类型到 bindings）。rc.26 未发布到
# crates.io，实际的 git 源由下方 [patch.crates-io] 覆盖（与 LocalDub/fnrpc 同一 rev）。
specta = { version = "=2.0.0-rc.26", features = ["derive"] }

# [patch.crates-io]：把 crates.io 上的 gpui 系列包整体替换为 zed 仓库对应 rev。
# 注意 patch 必须写在 workspace 根（子包里的 patch 会被 cargo 忽略并报错）。
[patch.crates-io]
specta = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-macros = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-serde = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-util = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.2.2" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.1.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.1.0" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.1.0" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "d88f68217b370f7a66d0c4b4971db31c0dff6df7", version = "=0.1.0" }

# 跨 crate 内联 `#[target_feature]` 函数（如 subtitle-finder 调 geometry 的 Sobel AVX-512）。
# 默认 release 下 `#[target_feature]` 函数跨 crate 不内联，导致调用开销；thin LTO +
# codegen-units=1 让链接时跨 crate 内联，性能接近同 crate（实测 sobel_n 0.15→0.11ms）。
# 注意：显著增加编译时间。
[profile.release]
lto = "thin"
codegen-units = 1
