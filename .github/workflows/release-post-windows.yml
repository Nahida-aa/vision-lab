name: release-post-windows

# 手动触发: 构建 subtitle_ocr_post 的单一后处理 CLI 二进制（subtitle_ocr_post）
# 的 Windows (x86_64-pc-windows-msvc) 资产，上传到 subtitle_ocr_post 对应
# GitHub Release。
#
# 该 CLI 只依赖纯 Rust（无 ort / opencv / ffmpeg），故 Windows 构建不需要
# LLVM/clang、OpenCV prebuilt、vcpkg ffmpeg，也不需要 onnxruntime —— 产物是
# 自带运行时的单 exe，zip 里只平铺 exe 即可。与 release-windows.yml（重型
# subtitle_ocr / subtitle_finder，需 opencv+ffmpeg）正交。
#
# 命名: subtitle_ocr_post-x86_64-pc-windows-msvc.zip，上传到 <tag>。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "上传目标 release tag（默认 subtitle-ocr-post-v0.1.2）"
        type: string
        default: "subtitle-ocr-post-v0.1.2"
      threshold:
        description: "构建阈值（预留，暂未用）"
        type: string
        default: ""

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup rust (stable MSVC)
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustc -vV
          cargo -V

      - name: build release bin (pure Rust, no system deps)
        shell: pwsh
        run: |
          cargo build --release -p subtitle_ocr_post
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          Get-ChildItem target\release\subtitle_ocr_post.exe | Select-Object Name, Length

      - name: package zip (exe only)
        shell: pwsh
        run: |
          $outDir = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $b = "subtitle_ocr_post"
          $staging = "$outDir\$b"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item ".\target\release\$b.exe" $staging
          $asset = "$outDir\$b-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          Write-Host "ASSET=$asset SHA256=$hash SIZE=$((Get-Item $asset).Length)"
          echo "$b-x86_64-pc-windows-msvc.zip`t$hash" >> "$outDir\sha256.txt"
          echo "OUT_DIR=$outDir" >> $env:GITHUB_ENV

      - name: upload assets to release
        shell: pwsh
        run: |
          $assets = (Get-ChildItem "$env:OUT_DIR\*-x86_64-pc-windows-msvc.zip").FullName
          gh release upload "${{ github.event.inputs.tag }}" $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }

      - name: print sha256
        shell: pwsh
        run: Get-Content "$env:OUT_DIR\sha256.txt"
