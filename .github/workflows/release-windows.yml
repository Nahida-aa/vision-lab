name: release-windows

# 手动触发: 构建 subtitle_finder / subtitle_ocr 的 Windows (x86_64-pc-windows-msvc)
# 资产并上传到 vision-lab 对应 GitHub Release。
#
# 资产形态: zip (exe + 运行时 dll)。动态链接官方 OpenCV 5.0.0 prebuilt + vcpkg ffmpeg,
# zip 里 exe 与全部所需 dll 平铺 (Windows PE 优先同目录找 dll), 解压目录即 bin dir。
# 命名: <bin>-x86_64-pc-windows-msvc.zip, 与 Linux 的单文件资产 `<bin>-x86_64-unknown-linux-gnu`
# 并存于同一 tag。
#
# 已知前提:
#   - 全局 .cargo/config.toml 带 -C target-feature=+avx2 (x86-64 2013+ 通用), 直接适用。
#   - onnxruntime 经 ort 的 download-binaries 拉 prebuilt, Windows x64 有预编译, 无需本机装。
#   - opencv crate 构建需要 clang (bindgen 解析 C++ 头), 故安装 LLVM。
#   - OpenCV 用官方 windows 预编译 5.0.0 (vcpkg 只有 opencv4, 与 Linux 系统 v5 头不一致)。
#     经 OPENCV_INCLUDE_PATHS/LINK_PATHS/LINK_LIBS (environment probe) 指向 prebuilt。
#   - ffmpeg-next (ffmpeg-sys-next) 在 Windows 经 FFMPEG_DIR 指向 vcpkg installed 根。
#   - 冒烟仅验证 exe 可启动 (dll 齐全), 完整 OCR 需模型, 留给真机。

on:
  workflow_dispatch:
    inputs:
      upload_ocr:
        description: "构建并上传 subtitle_ocr 主 bin 到 tag_ocr"
        type: boolean
        default: true
      upload_finder:
        description: "构建并上传 subtitle_finder 到 tag_finder"
        type: boolean
        default: true
      tag_ocr:
        description: "subtitle_ocr 上传目标 tag（默认 subtitle-ocr-v0.1.1）"
        type: string
        default: "subtitle-ocr-v0.1.1"
      tag_finder:
        description: "subtitle_finder 上传目标 tag（默认 subtitle-finder-v0.1.0）"
        type: string
        default: "subtitle-finder-v0.1.0"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup rust (stable MSVC)
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustc -vV
          cargo -V

      - name: install llvm (clang for opencv crate bindgen)
        shell: pwsh
        run: |
          # runner 预装 LLVM 可能只含 clang.exe 不含 libclang.dll, 强制完整安装补齐
          choco install llvm --no-progress -y --force 2>$null | Out-Null
          $llvm = "C:\Program Files\LLVM\bin"
          & "$llvm\clang.exe" --version
          # 定位 libclang.dll (bin 或 lib), 不存在则快速失败 (不浪费 vcpkg/cargo 编译轮)
          $hit = Get-ChildItem "C:\Program Files\LLVM" -Recurse -Filter libclang.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hit) { throw "libclang.dll not found under C:\Program Files\LLVM" }
          echo "LIBCLANG_PATH=$($hit.Directory.FullName)" >> $env:GITHUB_ENV
          echo "$($hit.Directory.FullName)" >> $env:GITHUB_PATH
          Write-Host "libclang at $($hit.FullName)"

      - name: cache opencv 5 prebuilt
        uses: actions/cache@v4
        with:
          path: C:/opencv5
          key: opencv-5.0.0-prebuilt-x64-windows-v1

      - name: cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-ffmpeg-x64-windows-v1

      - name: provision opencv 5 prebuilt + vcpkg ffmpeg
        shell: pwsh
        run: |
          # OpenCV 5.0.0 官方 windows 预编译 (7z SFX): 与 Linux 系统 v5 头对齐
          if (-not (Test-Path "C:\opencv5\opencv\build\include\opencv2\core\version.hpp")) {
            curl.exe -sL -o "$env:RUNNER_TEMP\opencv.exe" "https://github.com/opencv/opencv/releases/download/5.0.0/opencv-5.0.0-windows.exe"
            & "C:\Program Files\7-Zip\7z.exe" x "$env:RUNNER_TEMP\opencv.exe" "-oC:\opencv5" -y | Out-Null
          }
          Get-Item "C:\opencv5\opencv\build\x64\vc16\bin\opencv_world500.dll" | Select-Object Name, Length

          # vcpkg ffmpeg (供 ffmpeg-sys-next 经 FFMPEG_DIR 使用); windows-latest 预装 vcpkg
          if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          } else {
            $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
            if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
              & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
            }
          }
          Write-Host "VCPKG_ROOT=$vcpkgRoot"
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          & "$vcpkgRoot\vcpkg.exe" install "ffmpeg:x64-windows" "pkgconf:x64-windows"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg ffmpeg install failed" }

      - name: set linkage env
        shell: pwsh
        run: |
          $installed = "$env:VCPKG_ROOT\installed\x64-windows"
          # opencv crate: environment probe, 直接用官方 prebuilt 5.0.0 (与 Linux v5 一致)。
          # 不用 cmake probe: 官方 OpenCVConfig.cmake 需匹配 ARCH/RUNTIME, 而 probe 在
          # Ninja/无 MSVC 编译器下会当成 mingw → 找不到 vc16 二进制; env probe 从 header 取版本。
          echo "OPENCV_INCLUDE_PATHS=C:/opencv5/opencv/build/include" >> $env:GITHUB_ENV
          echo "OPENCV_LINK_PATHS=C:/opencv5/opencv/build/x64/vc16/lib" >> $env:GITHUB_ENV
          echo "OPENCV_LINK_LIBS=opencv_world500" >> $env:GITHUB_ENV
          # ffmpeg-sys-next: FFMPEG_DIR 指向 vcpkg installed 根 (lib+include 布局)
          echo "FFMPEG_DIR=$installed" >> $env:GITHUB_ENV
          echo "FFMPEG_PKG_CONFIG_PATH=$installed\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: build release bins
        shell: pwsh
        run: |
          # 注意：ocr-post / merge-frames 等后处理 CLI 已迁到 subtitle_ocr_post
          # （见 release-post-windows.yml，纯 Rust 无需 opencv/ffmpeg），本 workflow
          # 只负责重型推理 bin。
          cargo build --release -p subtitle_ocr --bin subtitle_ocr -p subtitle_finder --bin subtitle_finder
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          Get-ChildItem target\release\*.exe | Where-Object { $_.Name -match 'subtitle_ocr|ocr-post|subtitle_finder' } | Select-Object Name, Length

      - name: smoke test (dll 完整性)
        shell: pwsh
        run: |
          # 动态 dll 缺失时 Win 加载 exe 即失败; --help 退出码 0 证明依赖齐全
          # onnxruntime.dll 由 ort-sys 拷到 target\release (exe 同目录自动搜索);
          # opencv/ffmpeg dll 不在 exe 同目录, 需经 PATH 提供 (与 zip 平铺布局等效)
          $env:PATH = "C:\opencv5\opencv\build\x64\vc16\bin;$env:VCPKG_ROOT\installed\x64-windows\bin;$env:PATH"
          # ocr-post 等后处理 CLI 不在本 workflow 产物里（见 release-post-windows.yml）
          $exes = @("subtitle_ocr", "subtitle_finder") | Where-Object {
            ($_ -eq "subtitle_finder" -and "${{ github.event.inputs.upload_finder }}" -ne "false") -or
            ($_ -eq "subtitle_ocr" -and "${{ github.event.inputs.upload_ocr }}" -ne "false")
          }
          foreach ($e in $exes) {
            & ".\target\release\$e.exe" --help *> $null
            if ($LASTEXITCODE -ne 0) { throw "$e.exe failed to start (missing dll?)" }
            Write-Host "$e.exe OK (exit=0)"
          }

      - name: package zips + sha256
        shell: pwsh
        run: |
          $outDir = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $bins = @()
          if ("${{ github.event.inputs.upload_ocr }}" -ne "false") { $bins += "subtitle_ocr" }
          if ("${{ github.event.inputs.upload_finder }}" -ne "false") { $bins += "subtitle_finder" }
          # opencv prebuilt + vcpkg ffmpeg 的全部 dll 平铺进每个 zip, 与 exe 同目录
          # (opencv_world500 + videoio ffmpeg/msmf 插件 + ffmpeg 库)
          $opencvBin = "C:\opencv5\opencv\build\x64\vc16\bin"
          $ffmpegBin = "$env:VCPKG_ROOT\installed\x64-windows\bin"
          # onnxruntime.dll 由 ort-sys 拷到 target\release
          $dlls = @(Get-ChildItem "$opencvBin\*.dll") + @(Get-ChildItem "$ffmpegBin\*.dll") + @(Get-ChildItem ".\target\release\*.dll" -ErrorAction SilentlyContinue)

          foreach ($b in $bins) {
            $staging = "$outDir\$b"
            New-Item -ItemType Directory -Force -Path $staging | Out-Null
            Copy-Item ".\target\release\$b.exe" $staging
            Copy-Item $dlls.FullName $staging
            $asset = "$outDir\$b-x86_64-pc-windows-msvc.zip"
            Compress-Archive -Path "$staging\*" -DestinationPath $asset -Force
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
            Write-Host "ASSET=$asset SHA256=$hash SIZE=$((Get-Item $asset).Length)"
            echo "$b-x86_64-pc-windows-msvc.zip`t$hash" >> "$outDir\sha256.txt"
          }
          echo "OUT_DIR=$outDir" >> $env:GITHUB_ENV

      - name: upload assets to releases
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.upload_ocr }}" -ne "false") {
            gh release upload "${{ github.event.inputs.tag_ocr }}" "$env:OUT_DIR\subtitle_ocr-x86_64-pc-windows-msvc.zip" --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload ocr failed" }
          }
          if ("${{ github.event.inputs.upload_finder }}" -ne "false") {
            gh release upload "${{ github.event.inputs.tag_finder }}" "$env:OUT_DIR\subtitle_finder-x86_64-pc-windows-msvc.zip" --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload finder failed" }
          }

      - name: print sha256
        shell: pwsh
        run: |
          Get-Content "$env:OUT_DIR\sha256.txt"