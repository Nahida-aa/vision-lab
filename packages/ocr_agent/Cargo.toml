[package]
name = "ocr_agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ocr_agent"
path = "src/lib.rs"

[dependencies]
# 布局层：把颜色区域 + 文字框合成控件候选。
ocr_layout = { path = "../ocr_layout" }
# 图像类型（RgbImage 作为分析/点击的输入接口）。
image.workspace = true
# 通用图像转换（rgba→rgb 等），与业务解耦。
image_util = { workspace = true }
# 错误链。
anyhow.workspace = true
# 抓图后端：xdg-desktop-portal ScreenCast/PipeWire（跨 compositor，不依赖 opencv）。
# 用于「闭环验证」时自动重新抓帧，无需人工介入。capturer 自身不含 opencv，
# 之前的 opencv 重编失败来自 rapidocr_ort（dev-dep），与 capturer 无关。
capturer = { workspace = true }
# 屏幕操作层：在屏幕绝对坐标上注入鼠标/键盘（ydotool 后端）。ocr_agent 的
# YdotoolExecutor 内部复用它，避免把输入注入逻辑硬编码在本 crate。
screen_operator = { path = "../screen_operator" }
glam = { workspace = true }

# 示例侧依赖（examples 可用 dev-dependencies）。
[dev-dependencies]
rapidocr_ort = { workspace = true, features = ["default"] }
serde_json.workspace = true
# 驱动 capturer 的 async（ashpd 走 async-io 后端）。
async-io = "2"
# 日志/追踪：用 RUST_LOG=debug 开启 screen_operator 的移动每步调试。
tracing = { workspace = true }
tracing-subscriber.workspace = true
