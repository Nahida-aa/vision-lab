[package]
name = "ocr_layout"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ocr_layout"
path = "src/lib.rs"

[dependencies]
# 纯颜色连通域原语（控件边界主信号）。
color_analysis = { path = "../color_analysis" }
# 文字识别（控件标签锚点，辅助信号）。
rapidocr_ort = { workspace = true, features = ["default"] }
# 图像读取与 RGB 张量构造（喂给 rapidocr 的 detect）。
image.workspace = true
# ndarray：构造 HWC u8 张量传给 OcrEngine::detect（版本须与 rapidocr_ort 锁定的 0.17 一致）。
ndarray.workspace = true
# 结果可序列化为 JSON，便于上层 / 调试消费。
serde.workspace = true
# 示例侧 JSON 输出。
serde_json.workspace = true
# 错误链。
anyhow.workspace = true

# examples/split-panels 的 CLI 解析（库本体不需要）。
[dev-dependencies]
clap.workspace = true
image_util.workspace = true
