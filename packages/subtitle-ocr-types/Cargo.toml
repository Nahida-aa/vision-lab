[package]
name = "subtitle-ocr-types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Subtitle-OCR pipeline types (FrameResult, OcrSegment, OcrFramesResult, MergeFrames*) — depends on subtitle + ocr-types, no ort/opencv."

[features]
default = []
# 为 OCR 结果类型导出 specta::Type（供 LocalDub fnrpc 注册进 bindings）。
# SubtitleSegment 的 specta 派生由 subtitle crate 提供，这里一并开启。
specta-types = ["specta", "subtitle/specta-types"]

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { workspace = true, optional = true }
# 原子 OCR 检测框（OcrBoxResult，仍定义在 ocr-types）。
ocr-types = { workspace = true }
# 纯字幕领域（SubtitleSegment，被 OcrSegment 内嵌扩展）。
subtitle = { workspace = true }
