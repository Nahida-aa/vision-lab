[package]
name = "subtitle_finder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
# 多 binary（subtitle_finder + src/bin/perfbench.rs）时显式指定 cargo run 默认运行的
# 二进制，否则 cargo run 报错无法确定（与 subtitle_ocr 同款处理）。
default-run = "subtitle_finder"

[lib]
name = "subtitle_finder"
path = "src/lib.rs"

[dependencies]
# 几何 / SIMD 像素算子（交集、投影等）。
geometry = { workspace = true }
# 图像读取（RGB HWC u8）。
image.workspace = true
# 张量 / 序列化 / 错误链。
ndarray.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# CLI 参数解析（--output 枚举控制输出模式）。
clap.workspace = true
# 连通域（文字块检测），替代手写 CMyClosedFigure。
opencv = { workspace = true }
# 视频逐帧解码（30fps）。用 opencv::videoio::VideoCapture（与 C++/OpenCV 后端一致，
# 输出 bt709 BGR）；此前 ffmpeg-next 输出 bt601 BGR → 幽灵带 → 字幕段丢失。
# 结构化调试日志（对齐项目约定：调试日志用 tracing）。
tracing = { workspace = true }
tracing-subscriber.workspace = true
# 进度条（走 stderr，与 tracing/stdout 解耦，对齐 subtitle_ocr）。
indicatif = { workspace = true }
# 高并发 malloc（多 worker transform 大量 1MB 级分配，system malloc 锁竞争明显）。
mimalloc.workspace = true
