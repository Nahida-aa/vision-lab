[package]
name = "rapidocr_ort"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 既是库（供 ui_probe 等上层调用）也是二进制（命令行直接对图片跑 OCR）。
[lib]
name = "rapidocr_ort"
path = "src/lib.rs"

[[bin]]
name = "rapidocr_ort"
path = "src/main.rs"

[dependencies]
# 纯数据类型（OcrBoxResult 的唯一定义源，无重型依赖）。
ocr_types = { workspace = true }
# ONNX Runtime 推理（workspace 已 pin rc.13）。开 ndarray feature 以便直接吃
# ndarray::Array 构造输入张量。模型权重在 data/models/rapidocr 下，通过 --model 运行
# 时参数选择，不条件编译。
ort = { workspace = true, features = ["ndarray"] }
# 图像读取 + 预处理（Resize/Normalize/CHW 排列）。
image.workspace = true
# 矩阵/张量：版本必须与 ort(rc.13) 内部锁定的 ndarray 0.17 一致，否则 Array
# 类型不匹配（ort 的 OwnedTensorArrayData 只对其锁定的那份 ndarray 实现）。
ndarray.workspace = true
# 字典解析：v3 的 ppocr_keys.json 是 JSON 数组，v6 的 .txt 按行。
serde_json.workspace = true
# 错误链。
anyhow.workspace = true
opencv = { workspace = true }
# det 后处理几何（minAreaRect / offsetPolygon 等），与 cpp 的 cv::minAreaRect 逐位对齐。
geometry = { workspace = true }
# geometry 的多边形点类型用 glam::Vec2，这里需要同版本才能对接。
glam = { workspace = true }
# 纯 Rust 线性代数（透视变换 getPerspectiveTransform），替代 opencv 的矩阵求解。
faer = { workspace = true }

# 调试日志（对齐 AGENTS.md：用 tracing，调试后可不清除，RUST_LOG 控制级别）。
tracing.workspace = true

# 二进制侧依赖
clap.workspace = true
serde.workspace = true
