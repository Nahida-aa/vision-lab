[package]
name = "ocr-types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure data types + utility functions for OCR pipeline (no heavy deps like ort/opencv)."

[features]
default = []
# OcrBoxResult 当前无 specta 派生；保留 feature 仅用于按需启用可选 specta 依赖。
specta-types = ["specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { workspace = true, optional = true }
