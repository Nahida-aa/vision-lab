[package]
name = "subtitle_ocr_post"
# 独立版本号（不继承 workspace 的 0.1.0）：本 crate 是给下游直接当库用的（LocalDub
# 经 fnrpc 调用），算法语义变化需按自己的 semver 走，不必跟着二进制包的发版节奏。
version = "0.1.3"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OCR post-processing algorithms (merge, filter, adjust) — no ort/opencv dependency."

[features]
default = []
# 为 OCR 结果类型导出 specta::Type（供 LocalDub fnrpc 注册进 bindings）。
# SubtitleSegment / OcrSegment / SegmentFrame 的 specta 派生由 subtitle_ocr_types
# （及其依赖的 subtitle）提供，这里一并开启。
specta-types = ["specta", "subtitle_ocr_types/specta-types"]

# 后处理 CLI：单一汇总入口（src/main.rs）。5 个单步 CLI 已合并进
# `ocr-post`（现二进制名 = 包名 subtitle_ocr_post），单步只在本项目内单测，
# 不对外发单步能力。本 bin 只用纯算法（无 ort/opencv/ffmpeg），Windows 构建
# 免装 LLVM + OpenCV prebuilt + vcpkg ffmpeg。

[dependencies]
ocr_types = { workspace = true }
# 字幕 OCR 产物/管线类型（FrameResult/OcrSegment/MergeFrames*/工具函数等）来自
# subtitle_ocr_types；SubtitleSegment 的权威定义只在 `subtitle`，此处直接依赖以便构造。
subtitle = { workspace = true }
subtitle_ocr_types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { workspace = true, optional = true }
# —— 仅 bin 需要（库本身零 CLI 依赖）——
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
