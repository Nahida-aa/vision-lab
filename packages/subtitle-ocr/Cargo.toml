[package]
name = "subtitle-ocr"
# 独立版本号（不继承 workspace 0.1.0）：本包是二进制发布主体，随自身发版节奏走。
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
# 多 [[bin]] 时显式指定 cargo run 默认运行的二进制（否则 cargo run 报错无法确定）。
default-run = "subtitle-ocr"

# 既是库（供上层复用 OcrEngine + 字幕合并/计时）也是二进制（对标 cpp 的 CLI）。
[lib]
name = "subtitle_ocr"
path = "src/lib.rs"

# ⚠️ 后处理类 CLI（merge-frames / ocr-frames-*-box / ocr-segment-* / ocr-post）已迁到
# subtitle-ocr-post（见该包 Cargo.toml）：它们只用纯算法，不碰 rapidocr-ort → opencv，
# 跟着本包编会被迫先编 opencv（Windows CI 需 LLVM + OpenCV prebuilt）。本包只保留
# 需要推理引擎的 subtitle-ocr 主 bin。

[[bin]]
name = "subtitle-ocr"
path = "src/main.rs"

[dependencies]
ocr-types = { workspace = true }
# 字幕 OCR 产物/管线类型（FrameResult/OcrFrames*/MergeFrames*/工具函数等）。
subtitle-ocr-types = { workspace = true }
subtitle-ocr-post = { workspace = true }
# OCR 引擎（det/rec/cls 推理 + 模型加载 + 字典），本包只做字幕专属逻辑。
# 纯感知层（合并逻辑已迁入本包的 ocr_post::merge_frames / merge-frames CLI）。
rapidocr-ort = { workspace = true }
# 复用 rapidocr-ort 同款向量的按分量 min/max（SSE），与 polygon_metrics 一致。
glam.workspace = true
# 错误链 / 图像读取（RGB HWC u8）/ 张量 / 序列化 / CLI。
anyhow.workspace = true
image.workspace = true
ndarray.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# 日志：库内仅发 tracing 事件（不初始化 subscriber），二进制在 main 里初始化。
tracing.workspace = true
tracing-subscriber.workspace = true
# 进度条（UX 层反馈，独立于 tracing 诊断日志）。
indicatif.workspace = true
# 画面高度（`meta.video_height`）改由本包读图时写入，Y 惩罚不再需要 ffmpeg 读视频；
# 后处理 CLI 已迁到 subtitle-ocr-post，本包不再依赖 ffmpeg-next。
