[package]
name = "subtitle_ocr"
# 独立版本号（不继承 workspace 0.1.0）：本包是二进制发布主体，随自身发版节奏走。
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
# 多 [[bin]] 时显式指定 cargo run 默认运行的二进制（否则 cargo run 报错无法确定）。
default-run = "subtitle_ocr"

# 既是库（供上层复用 OcrEngine + 字幕合并/计时）也是二进制（对标 cpp 的 CLI）。
[lib]
name = "subtitle_ocr"
path = "src/lib.rs"

# ⚠️ 后处理类 CLI（merge-frames / ocr-frames-*-box / ocr-segment-* / ocr-post）已迁到
# subtitle_ocr_post（见该包 Cargo.toml）：它们只用纯算法，不碰 rapidocr_ort → opencv，
# 跟着本包编会被迫先编 opencv（Windows CI 需 LLVM + OpenCV prebuilt）。本包只保留
# 需要推理引擎的 subtitle_ocr 主 bin。

[[bin]]
name = "subtitle_ocr"
path = "src/main.rs"

# DirectML（GPU）执行后端专用 bin：与主 bin 不共用旗标（后端差异在二进制层面
# 分开）。无条件编译（普通 cargo build 也有产物）；实际执行 DirectML 需要开启
# ep-directml feature 构建，缺 feature 的产物在运行时建引擎一步硬报错（见
# rapidocr_ort ep.rs），不会静默回退 CPU。
[[bin]]
name = "subtitle_ocr_directml"
path = "src/bin/subtitle_ocr_directml.rs"

[features]
# 还原 rapidocr_ort 默认（ort 静态链接 + api-27，CI/VS2022 常规形态）；
# VS2019 本机构建用 `--no-default-features` 关掉，转 ort 动态链接。
default = ["rapidocr_ort/default"]
# GPU 执行后端（subtitle_ocr_directml bin 依赖此 feature；透传 rapidocr_ort → ort/directml）。
ep-directml = ["rapidocr_ort/ep-directml"]

[dependencies]
ocr_types = { workspace = true }
# 字幕 OCR 产物/管线类型（FrameResult/OcrFrames*/MergeFrames*/工具函数等）。
subtitle_ocr_types = { workspace = true }
subtitle_ocr_post = { workspace = true }
# OCR 引擎（det/rec/cls 推理 + 模型加载 + 字典），本包只做字幕专属逻辑。
# 纯感知层（合并逻辑已迁入本包的 ocr_post::merge_frames / merge-frames CLI）。
# workspace 已默认关 features；本包 default 里还原 rapidocr_ort 默认，VS2019
# 工具链下可用 `--no-default-features` 切到 ort 动态链接形态（见 rapidocr_ort
# [features] 注释）。
rapidocr_ort = { workspace = true }
# 复用 rapidocr_ort 同款向量的按分量 min/max（SSE），与 polygon_metrics 一致。
glam.workspace = true
# 错误链 / 图像读取（RGB HWC u8）/ 张量 / 序列化 / CLI。
anyhow.workspace = true
image.workspace = true
ndarray.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# 日志：库内仅发 tracing 事件（不初始化 subscriber），二进制在 main 里初始化。
tracing.workspace = true
tracing-subscriber.workspace = true
# 进度条（UX 层反馈，独立于 tracing 诊断日志）。
indicatif.workspace = true
# 画面高度（`meta.video_height`）改由本包读图时写入，Y 惩罚不再需要 ffmpeg 读视频；
# 后处理 CLI 已迁到 subtitle_ocr_post，本包不再依赖 ffmpeg-next。
